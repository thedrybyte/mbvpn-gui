<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Ultra-Refined Cyber Emerald Jewel Gradient -->
    <radialGradient id="greenJewelGrad" cx="44%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#00f784" />
      <stop offset="30%" stop-color="#00d45d" />
      <stop offset="70%" stop-color="#009e42" />
      <stop offset="100%" stop-color="#006629" />
    </radialGradient>

    <!-- Crisp White/Silver Rim Bevel -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#003814" stop-opacity="0.6" />
    </linearGradient>

    <!-- Concentric Subtle Inner Ring -->
    <linearGradient id="innerHaloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.1" />
    </linearGradient>

    <!-- Base Drop Shadow -->
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00a843" flood-opacity="0.35" />
    </filter>

    <!-- Depth Shadow for the White Official "M" Logo -->
    <filter id="mDepthShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#003d17" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Base Disc in Cyber Emerald -->
  <circle cx="128" cy="128" r="118" fill="url(#greenJewelGrad)" filter="url(#baseShadow)" />
  <circle cx="128" cy="128" r="117.5" fill="none" stroke="url(#rimGrad)" stroke-width="1.8" />

  <!-- Subtle Concentric Inner Precision Ring -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#innerHaloGrad)" stroke-width="1.5" />

  <!-- Official Malwarebytes "M" Brandmark in Pure Crisp White -->
  <g transform="translate(128, 128) scale(5.4) translate(-14.225, -12.4)" filter="url(#mDepthShadow)">
